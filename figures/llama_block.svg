<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Residual Spine (top) -->
  <line x1="24" y1="44" x2="546" y2="44" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="574" y1="44" x2="796" y2="44" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="824" y1="44" x2="860" y2="44" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="28" y="34" font-size="12" font-weight="600" fill="#334155">x</text>
  <text x="836" y="34" font-size="12" font-weight="600" fill="#334155">out</text>

  <!-- Attention Branch -->
  <circle cx="64" cy="44" r="3.5" fill="#475569"/>
  <path d="M 64 44 L 64 114 L 88 114" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RMSNorm 1 -->
  <rect x="90" y="90" width="96" height="48" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="138" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">RMSNorm</text>
  <text x="138" y="127" text-anchor="middle" font-size="10.5" fill="#3b82f6">attn_norm</text>

  <line x1="186" y1="114" x2="212" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Q, K, V Projections + RoPE -->
  <rect x="214" y="84" width="128" height="60" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="278" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Q, K, V Proj</text>
  <text x="278" y="128" text-anchor="middle" font-size="11" fill="#166534">+ RoPE(Q, K)</text>

  <!-- KV Cache box (below) -->
  <line x1="278" y1="144" x2="278" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="206" y="180" width="166" height="48" rx="7" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="289" y="201" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">Static KV Cache</text>
  <text x="289" y="217" text-anchor="middle" font-size="10.5" fill="#854d0e">update at cache_index</text>

  <!-- Q arrow to GQA & KV cache arrow to GQA -->
  <line x1="342" y1="114" x2="376" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 372 204 L 434 204 L 434 146" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- GQA Attention -->
  <rect x="378" y="84" width="124" height="60" rx="7" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#be185d">GQA Attention</text>
  <text x="440" y="128" text-anchor="middle" font-size="10.5" fill="#9d174d">+ W_o proj</text>

  <!-- Back to residual +1 -->
  <path d="M 502 114 L 560 114 L 560 60" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="560" cy="44" r="13" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="560" y="49" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">+</text>

  <!-- MLP Branch -->
  <circle cx="598" cy="44" r="3.5" fill="#475569"/>
  <path d="M 598 44 L 598 114 L 620 114" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RMSNorm 2 -->
  <rect x="622" y="90" width="92" height="48" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="668" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">RMSNorm</text>
  <text x="668" y="127" text-anchor="middle" font-size="10.5" fill="#3b82f6">mlp_norm</text>

  <line x1="714" y1="114" x2="736" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- SwiGLU MLP -->
  <rect x="738" y="90" width="114" height="48" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">SwiGLU MLP</text>

  <!-- Back to residual +2 -->
  <path d="M 810 90 L 810 60" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="810" cy="44" r="13" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="810" y="49" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">+</text>
</svg>
