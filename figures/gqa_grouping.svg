<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" width="380" height="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="380" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Group 0 -->
  <rect x="24" y="20" width="152" height="62" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Group 0</text>
  <rect x="36" y="46" width="58" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="65" y="63" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Q₀</text>
  <rect x="106" y="46" width="58" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="135" y="63" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Q₁</text>

  <!-- Group 1 -->
  <rect x="204" y="20" width="152" height="62" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="280" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Group 1</text>
  <rect x="216" y="46" width="58" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="245" y="63" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">Q₂</text>
  <rect x="286" y="46" width="58" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="315" y="63" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">Q₃</text>

  <!-- Sharing lines -->
  <line x1="65" y1="82" x2="100" y2="116" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="135" y1="82" x2="100" y2="116" stroke="#3b82f6" stroke-width="1.6"/>
  <line x1="245" y1="82" x2="280" y2="116" stroke="#8b5cf6" stroke-width="1.6"/>
  <line x1="315" y1="82" x2="280" y2="116" stroke="#8b5cf6" stroke-width="1.6"/>

  <!-- KV Heads -->
  <rect x="48" y="116" width="104" height="34" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="100" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">K₀, V₀</text>

  <rect x="228" y="116" width="104" height="34" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="280" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">K₁, V₁</text>
